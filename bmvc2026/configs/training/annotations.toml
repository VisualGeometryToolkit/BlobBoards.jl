# Config of record of scripts/training/build_annotations.jl: the descriptor
# training corpus — every source of the training footage annotated with its
# boards (per-frame canonical patches, BlobBoards `build_annotations`), then
# split by board identity into train/val/test (`split_training_data`). Written
# add-only into the run's keyed directory (VisualGeometryToolkitEval
# keyed_cell_dir: results_root()/<dataset>/<matcher>/<problem>/bmvc2026/annotations-<run_key>):
#   truth_images/   the per-frame annotations (+ refs/, _log.jsonl, build.log)
#   splits/         train.jld2, val.jld2, test.jld2
# NOTHING is written into the input tree. The same config is the same
# directory, which the annotation resumes (each source's _log.jsonl marker);
# a changed value is a new run. The descriptor network of record is NOT made
# here: it is an input (bb_assets), trained by the bootstrap chain the
# descriptor_training tiers publish.

[experiment]
generator = "annotations"
dataset = "blobboard_training"
# The results tree's layout (keyed_cell_dir: <dataset>/<matcher>/<problem>).
matcher = "blobboards"
problem = "descriptor_training"

# The inputs of record (VisualGeometryToolkitEval [inputs.<id>]: data_root()-
# relative). The footage tree is the authors' (unpublished as laid out here;
# the published training set is the descriptor_training tiers).
[inputs.boards]
tier = "unpublished"
path = "blobboard_training/boards"
provenance = "the training board definitions (blobboards/board/v5), generated by the authors"

[inputs.images]
tier = "unpublished"
path = "blobboard_training/images"
provenance = "photo sets, one directory each; a sibling <dir>.json is its camera (vgio/cameras/v3), absent = uncalibrated"

[inputs.videos]
tier = "unpublished"
path = "blobboard_training/videos"
provenance = "video sets, one directory each; a sibling <dir>.json is its camera, absent = uncalibrated"

[inputs.network]
tier = "bb_assets"
path = "models/track_logpolar_circ_s96_iter4.onnx"
provenance = "the descriptor network that finds the boards (the network of record, as configs/bmvc2026_260527.toml)"
sha256 = "6efc291ab94e812ce043d919ecc72ded7e4b16bd1c0c50b1492b1ce245bae8b9"

[gallery]
path = "board_gallery_training.jld2"   # a cache: results_root()/galleries/<path> (src/runs.jl gallery_path)

[annotate]
# The detector the annotation finds boards with. Every value stated: it is
# the annotation's, not the evaluation's run config.
polarity = "dark"
peak_threshold = 0.02
edge_threshold = 5.0
nms_cutoff = 2.0          # EllipseNms cutoff; BlobBoards' DEFAULT_CUTOFF (configs/authoring.toml [pattern] cutoff) when this was codified
min_inliers = 10          # PoseGeometry(camera) for a calibrated source, HomographyGeometry otherwise
cutoff = 2.0              # a blob's disc radius in σ: DEFAULT_CUTOFF (configs/authoring.toml), build_annotations' default
outer_extent = 96.0       # the canonical patch's outer extent: DEFAULT_OUTER_EXTENT (src/BlobBoards.jl), build_annotations' default
min_iou = 0.5             # build_annotations' default
video_frames = 30         # frames per video, stride-decimated
max_sources = 0           # per source directory, the first N files (0 = all): a smoke run states a cap, so it is keyed

[split]
# By board identity; the corpus split is chosen here (the library has no default).
validation_fraction = 0.1
test_fraction = 0.1
seed = 42
