# =============================================================================
# Package artifact catalog — the descriptor networks and the example data, one
# lazy entry each, all hosted in the BlobBoards Zenodo record
# (concept doi:10.5281/zenodo.21998310).
# =============================================================================
#
# This catalog CHOOSES nothing: which network a run uses is named by its config
# (`[descriptor] model = { artifact = "<entry>" }`, resolved in
# src/config_toml.jl). Entries are immutable by construction — a tarball
# sha256 plus a git-tree-sha1 — so a config always means the same bytes.
# Publishing newer weights = upload the tarball to a new version of the Zenodo
# record and ADD an entry here; never repoint an existing one.
#
# URLs name a Zenodo record VERSION (`records/<id>`, the stack's
# DataArtifacts.zenodo_url form): a published version's files are immutable,
# and the sha256 below verifies the download regardless.
#
# Record 23243553 is the version-1.1.0 draft of the BlobBoards record; its
# files resolve at these URLs once that version is published.

[track_logpolar_circ_s96_iter4]
git-tree-sha1 = "4018efc39186b1f7c287771d69da99817d73afd5"
lazy = true

    [[track_logpolar_circ_s96_iter4.download]]
    sha256 = "f92e3566ea747941f7efbd96ca0d5b322fdb74d2fcf5fdf7c8d582282aeaac67"
    url = "https://zenodo.org/records/23243553/files/track_logpolar_circ_s96_iter4.tar.gz?download=1"

