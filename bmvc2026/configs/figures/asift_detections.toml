# Config of record of scripts/make_asift_detections.jl: the RAW ASIFT detections
# (detect_blobs, before adaptation) on a blob-board photo, drawn on the photo and
# on a Gaussian-blurred copy of it.

[experiment]
generator = "asift_detections"
tiers = ["bb_pipeline_figure"]          # DSC02800 ships in bb_pipeline_figure (as for pipeline_panels)

[inputs]
image = "IMG_6441.jpeg"   # data_root()-relative (the adapted panels' teaser photo)

[detect]
device = "auto"                          # "auto" (CUDA on Linux, else CPU) | "cuda" | "cpu"
polarity = "dark"                        # "dark" | "light" | "none"
peak_threshold = 0.1
edge_threshold = 5.0
nms = "ellipse"                          # "ellipse" | "mxm" | "none" (every per-warp extremum, no cross-warp suppression)
nms_cutoff = "default"                   # EllipseNms footprint; "default" = BlobBoards.DEFAULT_CUTOFF
upsample = false                         # 2x upsample (pyramid from octave -1)

[blur]
sigma = 32.0                              # Gaussian σ of the blurred copy, in pixels of the photo
redetect = false                         # false: the SAME detections drawn on the blurred copy; true: detect again on it

[render]
crop = [100, 100, 3500, 4000]                                # [row0, col0, rows, cols] of the photo (1-based); [] = the full image
photo_px = 0                             # resize the photo layer to at most this width; 0 = as is (the original then ships as its source JPEG's bytes)
figure_width = 1600                      # Makie units per panel (= pt of the overlay PDF page); height follows the (cropped) image's aspect; strokes are relative to it
pt_per_unit = 1.0                        # PDF page: 1 pt per Makie unit (CairoMakie defaults to 0.75)
cutoff = "default"                       # ellipse drawn at cutoff·σ; "default" = BlobBoards.DEFAULT_CUTOFF
color_by = "single"                       # "warp" (one colour per ASIFT warp) | "single"
color = "cyan"                         # used when color_by = "single"
strokewidth = 1.5
alpha = 0.9

[output]
dir = "asift_detections"                 # under plotsdir()
paper_dir = "asift_detections"           # ALSO copied here, under papers/images (paper_images_dir; BB_PAPER_IMAGES overrides); "" = don't
names = ["asift_original", "asift_blurred", "asift_side_by_side"]   # bases: <name>_photo.jpg + <name>.pdf (overlay) + <name>.jpg (backup); the side-by-side is a JPEG only
side_by_side_gap = 15                    # px of white between the two panels

[jpeg]
quality = 90                             # the encoded photo layers and the backups
