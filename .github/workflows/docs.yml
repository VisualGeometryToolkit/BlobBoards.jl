name: Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - name: Install docs dependencies
        run: |
          julia -e 'using Pkg; Pkg.Registry.add("General")'
          julia --project=docs -e 'using Pkg; Pkg.instantiate()'   # a workspace member: resolves with the package
      - name: Build and deploy docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # the site deploys to github.com/blobboards/blobboards.github.io
          # the docs deploy to blobboards/blobboards.github.io, whose own deploy key is this secret
          # (BlobBoards.jl's DOCUMENTER_KEY is this repository's key, for TagBot and CompatHelper)
          DOCUMENTER_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
        run: julia --project=docs docs/make.jl
