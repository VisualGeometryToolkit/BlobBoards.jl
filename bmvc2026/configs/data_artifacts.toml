# =============================================================================
# data_artifacts — THE catalog of the BMVC 2026 paper's published INPUT data
# (only inputs are published; every result is regenerated by
# scripts/regenerate_paper.jl into results_root(), src/runs.jl):
# what each Zenodo-hosted Julia artifact (bmvc2026/Artifacts.toml, lazy,
# sha256-pinned) holds and where it mounts. The format and the checker are
# VisualGeometryToolkitEval's DataArtifacts (load_catalog, catalog_violations); the
# tarballs are built and bound by scripts/make_zenodo_artifacts.jl, whose tier
# filters are the authority on the file lists — this catalog names each tier's
# root directory and contents (kind `bb_tier`, a project kind: `dir` plus a
# `contents` description; `filter` is DataArtifacts' glob list for a `tree` entry), so it is derived from the existing bindings, not a
# second file list. src/data.jl's data_root() resolves the mounts.
#
# Mount `data` is the dataset root (the parent of absolute_pose_experiments/):
# the inputs/images/occlusion tiers hold paths under
# absolute_pose_experiments/, the assets and training tiers paths under the
# root itself (evaluation/, models/, descriptor_training/).
# =============================================================================

[catalog]
artifacts_toml = "../Artifacts.toml"

[records.bb]
title = "BlobBoards absolute-pose experiments (BMVC 2026): captures, motion-capture measurements, cameras, boards, synthetic occlusion images, board gallery and descriptor networks"
license = "CC-BY-4.0"
# Version 1.1.0 of the record (draft 23243553, resolving on publication):
# INPUTS ONLY. bb_absolute_pose_inputs replaces 1.0.0's metadata tier, which
# mixed results (detections, converted records, hand-eye fits, figures) with
# the inputs; bb_absolute_pose_val_260527 (detection overlays, a result) is
# dropped. The images and occlusion tiers are 1.0.0's tarballs reused
# unchanged (same sha256); bb_assets and bb_descriptor_training_metadata carry
# board definitions migrated to board/v3; plus bb_pipeline_figure. Version
# 1.0.0 (21998311) stays published and immutable.
#
# Version 1.2.0 (23921651, published 2026-11-03) carries every 1.1.0 tarball
# unchanged (same md5) and adds the bb_boards_* board sets (blobboards/board/v5).
#
# Version 1.3.0 (23937759): every record in its current schema, migrated once
# by VisualGeometryToolkitIO.vgio_migrate (each read back and compared): the
# board definitions in bb_absolute_pose_inputs (board/v1), bb_assets and
# bb_descriptor_training_metadata (board/v3) as blobboards/board/v5, uids and
# stored hashes.config kept, byte for byte the files of 1.2.0's bb_boards_*
# tiers; the cameras of record and bb_pipeline_figure's camera as
# vgio/cameras/v4. The occlusion and training-sources tiers are 1.0.0's
# tarballs, unchanged. The images tier is NOT in 1.3.0: it is its own record,
# bb_images below, so that this one downloads quickly.
#
# The cameras of record are in the inputs tier (<session>/calibration/<camera>.json,
# the native port of the upstream calibration export, which ships beside it
# under provenance/) — `camera_of_record` (src/data.jl) reads calibration/.
id = "23937759"
placeholder = "ZENODO_RECORD_ID"

[records.bb_images]
title = "BlobBoards absolute-pose images (260527)"
license = "MIT"
# The captures of the 260527 session, split off the data record at its version
# 1.3.0 (versions 1.0.0-1.2.0 carry them), published as a supplement of it
# (concept doi:10.5281/zenodo.21998310; this record doi:10.5281/zenodo.23965208,
# licence as the data record's Zenodo entry). The tarball drops the session's
# two superseded camera files (260527/images/*.json, retired vgio/cameras/v1,
# never read); the captures are unchanged. The packer binds it with this
# record's id as its record argument
# (scripts/make_zenodo_artifacts.jl images <staging> 23965208).
id = "23965208"
placeholder = "ZENODO_IMAGES_RECORD_ID"

[artifacts.bb_absolute_pose_inputs]
kind = "bb_tier"
dir = "absolute_pose_experiments"
contents = "per published session: poses/motion_tracker/<subset>/marker_*.json[.del], calibration/<camera>.json (scripts/import_cameras.jl's output), boards/ without *_tmp.png; teaser/{DSC04596.png,testit.jpg}; provenance/ (BlobBoards-Evaluation-main.zip, calibration/<session>/<upstream export>, README.md)"
mount = "data"
record = "bb"
required = true
what = "the motion-capture measurements of record (the tracker's per-frame exports), the cameras of record (vgio/cameras/v4, with their calibration block), the board definitions of the three marker systems (the BlobBoards ones as blobboards/board/v5), the teaser photos, and the provenance material (the external evaluation code archive and the upstream calibration exports)"
provenance = "captured by the authors (absolute_pose_experiments/260527); cameras: OpenCV calibrateCamera by BlobBoards-Evaluation calibrate_pinhole, ported by scripts/import_cameras.jl; packed by scripts/make_zenodo_artifacts.jl"

[artifacts.bb_absolute_pose_images_260527]
kind = "bb_tier"
dir = "absolute_pose_experiments/260527/images"
contents = "all but the superseded camera files (*.json directly under 260527/images)"
mount = "data"
record = "bb_images"
required = false
what = "the evaluation, calibration and intrinsic-calibration captures of the 260527 session (record 1.0.0's captures, unchanged; the cameras of record are in the inputs tier)"
provenance = "captured and processed by the authors (absolute_pose_experiments/260527), packed by scripts/make_zenodo_artifacts.jl"

