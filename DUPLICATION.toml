# BlobBoards' entries for VisualGeometryToolkitCore's `check_duplication`. Owner ruling
# (2026-11-11): every duplicate is hoisted into its one owner; an entry is allowed only
# where the two things are NOT the same concept, and its reason is the one-line proof.
# An entry that stops matching anything is itself a finding: remove it.

[[name]]
module = "BlobBoards"
name = "_TOML_DEFAULTS"
reason = "not code but each package's own data: BlobBoards' parsed configs/default.toml [find_boards] tree and LODR's/Estimation's are different files with different tables; each is parsed by Core's one `parse_defaults` and read through Core's `toml_default` (the idiom parse_defaults' docstring states)"

[[name]]
module = "BlobBoards"
name = "_dflt"
reason = "each package's own data: BlobBoards' `_dflt` looks up BlobBoards' configs/default.toml, Estimation's its own file; both are one line over Core's one `toml_default`"

[[name]]
module = "BlobBoards"
name = "default_config_path"
reason = "each package's own data: the path of BlobBoards' configs/default.toml (the run configuration of record), not Estimation's RANSAC defaults file; the stack idiom `parse_defaults(default_config_path())`"

[[name]]
module = "BlobBoards"
name = "board"
reason = "different concepts: BlobBoards' `board(args...)` is its Makie recipe that DRAWS a board's blobs into an image axis; Core's `board(t::PlanarTarget)` is the accessor returning the physical Board a target is printed on; no call of one is a call of the other"

[[backend]]
file = "src/training.jl"
function = "_execution_provider"
reason = "a provider choice, not a second computation: the training pipeline's ONNX session runs the same network on the provider that matches its compute backend (:cpu on KA.CPU, :cuda otherwise), so a CPU run does not ask for the CUDA provider; no kernel or arithmetic differs by backend"

[[backend]]
file = "src/adapt_ka.jl"
function = "_adapt_groupsize"
reason = "a launch-policy value, not a compute twin: the ONE adaptation kernel set runs on every backend with a workgroup per blob, 256 work items on a GPU and one on the CPU (the CPU group is one item, for which Core's tree_sum! returns at once); the size also sets each launch's ndrange (gs·N), so it is not only OnBackend's workgroupsize"

# A standing entry (owner, 0.6.3; restored at 0.7.0): seen when the stack paths hold the monorepo.
[[similar]]
functions = ["src/config_toml.jl::toml_field", "VisualGeometryToolkitCore:test/config_toml_tests.jl::VgtkCore.toml_field"]
reason = "not the same concept: two methods of Core's one TOML hook `toml_field` (a CONTRACT_GENERICS extension point) on DIFFERENT types, BlobBoards' FindBoardsConfig (its `max_detections`) here and a test fixture's struct in Core's tests: dispatch, not a copy; the hook's \"unbounded\" spelling is the contract's"
