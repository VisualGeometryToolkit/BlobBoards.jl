# Config of record of scripts/make_param_variations.jl: fig:params, the
# pattern-parameter ablation (a baseline and two variations of each of cutoff,
# alpha, max diameter fraction and minimum blob scale).

[experiment]
generator = "param_variations"
tiers = []                               # no dataset: patterns are generated

[pattern]
# The originals' seeds were drawn from RandomDevice and are lost; ONE fixed
# seed for all panels (the panels of a row then differ only by the varied
# parameter). Everything else was recovered from the submitted images.
seed = "0x0000000020260821"
resolution_px = 1890                     # 40 mm at 1200 dpi
dpi = 1200
scales_per_octave = 3
max_trials = 5000
pixel_type = "gray8"
polarity = "dark"
raster_aligned = true

[output]
dir = "blob_variations_squared"          # under papers/images
sidecars = "param_variations"            # under plotsdir(): the regenerated configs + blobs (JSON)

# cutoff, alpha, max_diameter_fraction, min_scale_mm => the paper's file name
# (its <uid>_<hash5> is the historical identity of the lost original).
[[panels]]
cutoff = 1.5
alpha = 1.2
max_diameter_fraction = 0.4
min_scale_mm = 0.2
name = "blob_pattern_259_e8a21_co1.5_a1.2_df0.4_s0.2.png"   # baseline

