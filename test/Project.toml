# The test environment (Pkg >= 1.11 form; replaces [extras]/[targets]). A
# workspace member of ../Project.toml, so Pkg.test() runs it without a sandbox,
# against the workspace's one Manifest. CUDA and cuDNN are ordinary deps here
# (BlobBoards' weakdeps): the CUDA and Lux-inference paths are exercised when a
# GPU is present.
#
# TWO EXTENSIONS NEVER LOAD UNDER `Pkg.test`, because their triggers are not
# deps here. An extension whose triggers are absent is not merely untested — it
# cannot even fail to compile, so edits to it ship unverified. Each omission is
# deliberate:
#
#   BlobBoardsTrainingExt  Reactant — cannot coexist with the cuDNN the
#                          evaluation path needs (Reactant bundles its own);
#                          that conflict is why Lux inference and training are
#                          separate extensions in the first place.
#   BlobBoardsLuxExt       Lux + NNlib — adding them pulls the whole Lux stack
#                          into the test env for one inference backend.
#
# So verify them BY HAND when you touch them. LuxExt: the bmvc2026 member
# already has Lux + cuDNN. TrainingExt: a scratch Project.toml (outside the
# workspace) carrying every trigger (Reactant, Lux, NNlib, …) with
# `[sources] BlobBoards = { path = "<checkout>" }`, then
#
#   julia --project=<scratch> -e 'using Pkg; Pkg.resolve(); Pkg.instantiate(); Pkg.precompile()'
#
# and read the "BlobBoards → BlobBoardsTrainingExt" line. Pkg.precompile
# compiles each extension with exactly its own triggers.
[deps]
