# Environment for the example scripts (examples/generate, examples/pipeline).
#
# The pipeline examples load GLMakie (windows), CairoMakie (figures) and
# CUDA + cuDNN (GPU + the ONNX CUDA provider). All four are BlobBoards [weakdeps], and Julia never loads a
# package's own weakdeps from that package's project env, so `--project=.`
# cannot run them (README claimed it could until 2026-09-07). This env dev's
# the checkout and lists every package the examples import directly — a
# stacked environment exposes only DIRECT deps to `using`.
#
#   julia --project=examples examples/pipeline/find_boards.jl
#   julia --project=examples examples/generate/board.jl
#
# Headless nodes: GLMakie cannot precompile without a display, so
# `Pkg.instantiate` reports it; everything else in the env still works. Use
# `gpu/` (no Makie) for headless GPU work and the SLURM CLIs, `authoring/`
# for a lightweight board-authoring REPL. The Manifest is gitignored.
#
# The CUDA runtime pin matches the root Project.toml (ORT's CUDA provider takes
# 12.x); it lives here because .gitignore excludes LocalPreferences.toml.

[deps]
BlobBoards = "93a5632c-6c4c-4c98-b3b2-221d1d9ee9e0"
CairoMakie = "13f3f980-e62b-5c42-98c6-ff1f3baf88f0"
Colors = "5ae59095-9a9b-59fe-a467-6f913c188581"
CoordinateTransformations = "150eb455-5306-5404-9cee-2592286d6298"
CUDA = "052768ef-5323-5732-b1bb-66c8b64840ba"
CUDA_Runtime_jll = "76a88914-d11a-5bdc-97e0-2f5a05c973a2"
cuDNN = "02a925ec-e4fe-4b08-9a7e-0d78e3d38ccd"
FileIO = "5789e2e9-d7fb-5bc7-8068-2c6fae9b9549"
GeometryBasics = "5c1252a2-5f33-56bf-86c9-59e7332b4326"
GLMakie = "e9467ef8-e4e7-5192-8a1a-b1aee30e663a"
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"
RobustVisualGeometry = "48970fad-9a21-401c-bf6c-679fa4f2bd7f"
StaticArrays = "90137ffa-7385-5640-81b9-e52037218182"
Statistics = "10745b16-79ce-11e8-11f9-7d13ad32a3b2"
VideoIO = "d6d074c3-1acf-5d4c-9a43-ef38773959a2"
VisualGeometryCore = "297d53b8-c8d7-4cd7-a9af-68e656508a81"
VisualGeometryFeatures = "9e05951d-65eb-41d6-b120-50dff4d82817"
VisualGeometryIo = "d0441031-17df-4f07-bc88-8d8f5a818e7b"

[sources]
BlobBoards = { path = ".." }

[compat]
CUDA = "5.11.0"
CUDA_Runtime_jll = "0.21"
