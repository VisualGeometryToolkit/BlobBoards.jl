what = "the synthetic occlusion images at 0% (inputs: the detections on them are regenerated)"
provenance = "synthesized from the 260527 captures by the external generator BlobBoards-Evaluation 88bca9f evaluation_pipe/occlusion_generator.py (hand-clicked board corners, a MAGSAC homography per board, 2026-05-30; the code archive is in the inputs tier under provenance/), packed by scripts/make_zenodo_artifacts.jl"

