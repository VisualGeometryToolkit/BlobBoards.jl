name: CI

on:
  push:
    branches:
      - master
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.12'
        os:
          - ubuntu-latest
    env:
      # A hosted runner has no GPU: the `:gpu` test items are skipped (the
      # suite also skips them by itself when CUDA is not functional).
      BB_TEST_SKIP_GPU: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      # The Python interface's interpreter (numpy, pint, the `blobboards`
      # package) comes from the pixi `py` environment; its activation sets
      # JULIA_PYTHONCALL_EXE and JULIA_CONDAPKG_BACKEND for the test run.
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: py
      - uses: julia-actions/julia-buildpkg@v1
      - name: Run tests
        run: pixi run -e py julia --color=yes --project=. -e 'using Pkg; Pkg.test(; coverage = true)'
      # The Python package itself (python/tests: argument handling, the
      # docstring examples, parity with Julia). It runs Julia in the checkout's
      # authoring/ env (PythonCall + the dev'd checkout); the GPU tests skip
      # themselves on a hosted runner.
      - name: Run Python tests
        working-directory: python
        run: pixi run -e py pytest tests -q -p no:cacheprovider
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
