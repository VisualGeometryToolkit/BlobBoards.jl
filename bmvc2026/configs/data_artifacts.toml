# =============================================================================
# data_artifacts — THE catalog of the BMVC 2026 paper's published INPUT data
# (only inputs are published; every result is regenerated by
# scripts/regenerate_paper.jl into results_root(), src/runs.jl):
# what each Zenodo-hosted Julia artifact (bmvc2026/Artifacts.toml, lazy,
# sha256-pinned) holds and where it mounts. The format and the checker are
# VisualGeometryToolkitEval's DataArtifacts (load_catalog, catalog_violations); the
# tarballs are built and bound by scripts/make_zenodo_artifacts.jl, whose tier
# filters are the authority on the file lists — this catalog names each tier's
# root directory and filter (kind `bb_tier`, a project kind: `dir` plus a
# `filter` description), so it is derived from the existing bindings, not a
# second file list. src/data.jl's data_root() resolves the mounts.
#
# Mount `data` is the dataset root (the parent of absolute_pose_experiments/):
# the inputs/images/occlusion tiers hold paths under
# absolute_pose_experiments/, the assets and training tiers paths under the
# root itself (evaluation/, models/, descriptor_training/).
# =============================================================================

[catalog]
artifacts_toml = "../Artifacts.toml"

[records.bb]
title = "BlobBoards absolute-pose experiments (BMVC 2026): captures, motion-capture measurements, cameras, boards, synthetic occlusion images, board gallery and descriptor networks"
license = "CC-BY-4.0"
# Version 1.1.0 of the record (draft 23243553, resolving on publication):
# INPUTS ONLY. bb_absolute_pose_inputs replaces 1.0.0's metadata tier, which
# mixed results (detections, converted records, hand-eye fits, figures) with
# the inputs; bb_absolute_pose_val_260527 (detection overlays, a result) is
# dropped. The images and occlusion tiers are 1.0.0's tarballs reused
# unchanged (same sha256); bb_assets and bb_descriptor_training_metadata carry
# board definitions migrated to board/v3; plus bb_pipeline_figure. Version
# 1.0.0 (21998311) stays published and immutable.
#
# The cameras of record are in the inputs tier (<session>/calibration/<camera>.json,
# the native port of the upstream calibration export, which ships beside it
# under provenance/). The images tier's own camera files are superseded and
# never read — `camera_of_record` (src/data.jl) reads calibration/.
id = "23243553"
placeholder = "ZENODO_RECORD_ID"

[artifacts.bb_absolute_pose_inputs]
kind = "bb_tier"
dir = "absolute_pose_experiments"
filter = "per published session: poses/motion_tracker/<subset>/marker_*.json[.del], calibration/<camera>.json (scripts/import_cameras.jl's output), boards/ without *_tmp.png; teaser/{DSC04596.png,testit.jpg}; provenance/ (BlobBoards-Evaluation-main.zip, calibration/<session>/<upstream export>, README.md)"
mount = "data"
record = "bb"
required = true
what = "the motion-capture measurements of record (the tracker's per-frame exports), the cameras of record (vgio/cameras/v3, with their calibration block), the board definitions of the three marker systems, the teaser photos, and the provenance material (the external evaluation code archive and the upstream calibration exports)"
provenance = "captured by the authors (absolute_pose_experiments/260527); cameras: OpenCV calibrateCamera by BlobBoards-Evaluation calibrate_pinhole, ported by scripts/import_cameras.jl; packed by scripts/make_zenodo_artifacts.jl"

[artifacts.bb_absolute_pose_images_260527]
kind = "bb_tier"
dir = "absolute_pose_experiments/260527/images"
filter = "all"
mount = "data"
record = "bb"
required = false
what = "the evaluation, calibration and intrinsic-calibration captures of the 260527 session (record 1.0.0's tarball, unchanged; its camera files are superseded and unused — the cameras of record are in the inputs tier)"
provenance = "captured and processed by the authors (absolute_pose_experiments/260527), packed by scripts/make_zenodo_artifacts.jl"

[artifacts.bb_absolute_pose_occlusion_00_260527]
kind = "bb_tier"
dir = "absolute_pose_experiments/260527/occlusion/00/images"
filter = "all"
mount = "data"
record = "bb"
required = false
what = "the synthetic occlusion images at 0% (inputs: the detections on them are regenerated)"
provenance = "synthesized from the 260527 captures by the external generator BlobBoards-Evaluation 88bca9f evaluation_pipe/occlusion_generator.py (hand-clicked board corners, a MAGSAC homography per board, 2026-05-30; the code archive is in the inputs tier under provenance/), packed by scripts/make_zenodo_artifacts.jl"

