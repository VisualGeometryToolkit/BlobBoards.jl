name: CI

on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.12'
        os:
          - ubuntu-latest
    env:
      # A hosted runner has no GPU: the `:gpu` test items are skipped (the
      # suite also skips them by itself when CUDA is not functional).
      BB_TEST_SKIP_GPU: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      # The Python interface's interpreter (numpy, pint, the `blobboards`
      # package) comes from the pixi `py` environment; its activation sets
      # JULIA_PYTHONCALL_EXE and JULIA_CONDAPKG_BACKEND for the test run.
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: py
      # The CUDA_Runtime_jll version pin (12.9, for ONNXRunTime's CUDA provider)
      # forces the CUDA artifacts onto a runner that has no GPU driver, and
      # CUDNN_jll then fails to load (libcuda.so.1 missing) when cuDNN
      # precompiles. Unpinned, a driverless host selects no CUDA artifact and
      # the GPU paths are skipped — so this checkout drops the pin.
      - name: Drop the CUDA runtime pin (no GPU driver here)
        run: julia -e 'using TOML; for f in filter(isfile, ["Project.toml"; joinpath.(readdir(), "Project.toml")]); p = TOML.parsefile(f); prefs = get(p, "preferences", Dict()); haskey(prefs, "CUDA_Runtime_jll") || continue; delete!(prefs, "CUDA_Runtime_jll"); isempty(prefs) && delete!(p, "preferences"); open(io -> TOML.print(io, p), f, "w"); end'
      # CauRegistry as well as General until the stack is in General. The repo is
      # one workspace: instantiating the test member resolves every member into
      # the one root Manifest and installs what the tests need.
      - name: Instantiate the test environment
        run: |
          julia -e 'using Pkg; Pkg.Registry.add("General"); Pkg.Registry.add(url = "https://github.com/prittjam/CauRegistry.jl")'
          julia --project=test -e 'using Pkg; Pkg.instantiate()'
      - name: Run tests
        run: pixi run -e py julia --color=yes --project=. -e 'using Pkg; Pkg.test(; coverage = true)'
      # The Python package itself (python/tests: argument handling, the
      # docstring examples, parity with Julia). It runs Julia in the checkout's
      # authoring/ env (PythonCall + the dev'd checkout); the GPU tests skip
      # themselves on a hosted runner.
      - name: Instantiate the Python package's Julia environment (authoring/)
        run: julia --project=authoring -e 'using Pkg; Pkg.instantiate()'
      - name: Run Python tests
        working-directory: python
        run: pixi run -e py pytest tests -q -p no:cacheprovider
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
