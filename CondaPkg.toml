# Read by CondaPkg wherever BlobBoards sits beside PythonCall outside pixi (the
# test/ and authoring/ members, or a user's own environment). conda-forge's
# python 3.15.2 (build h6e52b48_100, 2026-10-26) ships no libpython, which
# PythonCall loads, so an unpinned plain-Julia bootstrap fails in
# BlobBoardsPythonExt's precompile with "Could not find Python library". The
# pixi `py` env is unaffected (JULIA_CONDAPKG_BACKEND = "Null", locked 3.14).
# Lift the cap once a 3.15 build carries libpython again.
[deps]
python = ">=3.10,<3.15"
